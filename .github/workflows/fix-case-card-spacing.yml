name: Fix Case Study card spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-case-card-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Case Study spacing override and bump cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css = Path('assets/styles.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* CASE STUDY CARD SPACING HOTFIX · 20260830 */'
          patch = (
              '\n\n/* CASE STUDY CARD SPACING HOTFIX · 20260830 */\n'
              '.case-dark .case-grid2{margin-top:32px;gap:24px}\n'
              '@media(max-width:800px){.case-dark .case-grid2{margin-top:24px;gap:16px}}\n'
          )
          if marker not in s:
              css.write_text(s + patch, encoding='utf-8')
          for path in [Path('work/north/index.html'),Path('work/flow/index.html'),Path('work/motion/index.html')]:
              h = path.read_text(encoding='utf-8')
              h = h.replace('styles.css?v=20260830-caseaction1','styles.css?v=20260830-caseaction2')
              path.write_text(h, encoding='utf-8')
          PY
      - name: Commit and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-case-card-spacing.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: improve Case Study card spacing'
          git push origin main
