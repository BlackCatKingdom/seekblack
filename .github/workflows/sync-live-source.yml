name: Sync live SEEKBLACK source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-live-source.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch deployed SEEKBLACK source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/seekblack-source
          mkdir -p "$ROOT/assets" "$ROOT/work/north" "$ROOT/work/flow" "$ROOT/work/motion"
          cp README.md "$ROOT/README.md"
          cp .gitignore "$ROOT/.gitignore"
          fetch(){ curl -fsSL --retry 3 --connect-timeout 15 "$1" -o "$2"; }
          fetch 'https://seekblack.cn/' "$ROOT/index.html"
          fetch 'https://seekblack.cn/404.html' "$ROOT/404.html"
          fetch 'https://seekblack.cn/assets/styles.css' "$ROOT/assets/styles.css"
          fetch 'https://seekblack.cn/assets/site.js' "$ROOT/assets/site.js"
          fetch 'https://seekblack.cn/assets/favicon.svg' "$ROOT/assets/favicon.svg"
          fetch 'https://seekblack.cn/assets/og-seekblack.png' "$ROOT/assets/og-seekblack.png"
          fetch 'https://seekblack.cn/assets/wechat-qr.png' "$ROOT/assets/wechat-qr.png"
          fetch 'https://seekblack.cn/robots.txt' "$ROOT/robots.txt"
          fetch 'https://seekblack.cn/sitemap.xml' "$ROOT/sitemap.xml"
          fetch 'https://seekblack.cn/work/north/index.html' "$ROOT/work/north/index.html"
          fetch 'https://seekblack.cn/work/flow/index.html' "$ROOT/work/flow/index.html"
          fetch 'https://seekblack.cn/work/motion/index.html' "$ROOT/work/motion/index.html"
          grep -q 'BUILD WHAT MATTERS' "$ROOT/index.html"
          grep -q 'north.seekblack.cn' "$ROOT/work/north/index.html"
          grep -q 'flow.seekblack.cn' "$ROOT/work/flow/index.html"
          grep -q 'motion.seekblack.cn' "$ROOT/work/motion/index.html"
          test -s "$ROOT/assets/styles.css"
          test -s "$ROOT/assets/site.js"
          test -s "$ROOT/assets/og-seekblack.png"
          test -s "$ROOT/assets/wechat-qr.png"

      - name: Publish clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .
          cp -a /tmp/seekblack-source/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: publish complete SEEKBLACK V3 source'
          git push origin main
