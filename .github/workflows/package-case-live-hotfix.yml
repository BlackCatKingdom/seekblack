name: Package case live hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-case-live-hotfix.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hotfix package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/seekblack.cn/assets
          mkdir -p package/seekblack.cn/work/north package/seekblack.cn/work/flow package/seekblack.cn/work/motion
          cp assets/styles.css package/seekblack.cn/assets/styles.css
          cp work/north/index.html package/seekblack.cn/work/north/index.html
          cp work/flow/index.html package/seekblack.cn/work/flow/index.html
          cp work/motion/index.html package/seekblack.cn/work/motion/index.html
      - name: Upload deploy package
        uses: actions/upload-artifact@v4
        with:
          name: SEEKBLACK-Case-Live-Action-Hotfix
          path: package/seekblack.cn
          if-no-files-found: error
          retention-days: 7
