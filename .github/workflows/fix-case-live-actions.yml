name: Fix case live action hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-case-live-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live action hierarchy and hover states
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('work/north/index.html'): (
                  '<a class="project-link" href="https://github.com/BlackCatKingdom/north-architecture-demo" target="_blank" rel="noopener">VIEW SOURCE ↗</a><small>',
                  '<div class="case-live-secondary"><a class="project-link" href="https://github.com/BlackCatKingdom/north-architecture-demo" target="_blank" rel="noopener">查看源码 · GitHub ↗</a></div><small>'
              ),
              Path('work/flow/index.html'): (
                  '<a class="project-link" href="https://flow.seekblack.cn/admin/" target="_blank" rel="noopener">打开商家后台 ↗</a><a class="project-link" href="https://github.com/BlackCatKingdom/flow-mini-program-demo" target="_blank" rel="noopener">VIEW SOURCE ↗</a><small>',
                  '<div class="case-live-secondary"><a class="project-link" href="https://flow.seekblack.cn/admin/" target="_blank" rel="noopener">打开商家后台 ↗</a><a class="project-link" href="https://github.com/BlackCatKingdom/flow-mini-program-demo" target="_blank" rel="noopener">查看源码 · GitHub ↗</a></div><small>'
              ),
              Path('work/motion/index.html'): (
                  '<a class="project-link" href="https://github.com/BlackCatKingdom/motion-fitness-app-demo" target="_blank" rel="noopener">VIEW SOURCE ↗</a><small>',
                  '<div class="case-live-secondary"><a class="project-link" href="https://github.com/BlackCatKingdom/motion-fitness-app-demo" target="_blank" rel="noopener">查看源码 · GitHub ↗</a></div><small>'
              ),
          }

          for path, (old, new) in replacements.items():
              s = path.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected markup not found: {path}')
              path.write_text(s.replace(old, new, 1), encoding='utf-8')

          css = Path('assets/styles.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* CASE LIVE ACTION HOTFIX · 20260830 */'
          patch = (
              '\n\n/* CASE LIVE ACTION HOTFIX · 20260830 */\n'
              '.case-live-action{gap:16px}\n'
              '.case-live-secondary{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}\n'
              '.case-live .case-live-secondary .project-link{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 13px;border:1px solid rgba(255,255,255,.24);border-radius:999px;color:#fff;background:transparent;font-size:.76rem;line-height:1;white-space:nowrap;transition:transform .22s var(--ease),background .22s ease,color .22s ease,border-color .22s ease}\n'
              '.case-live .case-live-secondary .project-link:hover{color:#111;background:#fff;border-color:#fff;transform:translateY(-1px)}\n'
              '.case-live .case-live-secondary .project-link:focus-visible{color:#111;background:#fff;border-color:#fff}\n'
              '.case-live-action>small{margin-top:2px}\n'
              '@media(max-width:560px){.case-live-secondary{width:100%;gap:9px}.case-live .case-live-secondary .project-link{font-size:.73rem;padding:9px 12px}}\n'
          )
          if marker not in s:
              css.write_text(s + patch, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-case-live-actions.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: clarify and separate case study live actions'
          git push origin main
