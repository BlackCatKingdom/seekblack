name: Cleanup temporary branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-branch.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary branch and workflow
        run: |
          git push origin --delete source-import || true
          git rm .github/workflows/cleanup-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary import branch'
          git push origin main
