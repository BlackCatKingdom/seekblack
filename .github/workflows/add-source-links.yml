name: Add case study source links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-source-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add GitHub source links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'work/north/index.html': (
              '<a class="btn btn-brand" href="https://north.seekblack.cn/" target="_blank" rel="noopener">VISIT LIVE SITE ↗</a><small>',
              '<a class="btn btn-brand" href="https://north.seekblack.cn/" target="_blank" rel="noopener">VISIT LIVE SITE ↗</a><a class="project-link" href="https://github.com/BlackCatKingdom/north-architecture-demo" target="_blank" rel="noopener">VIEW SOURCE ↗</a><small>'
            ),
            'work/flow/index.html': (
              '<a class="project-link" href="https://flow.seekblack.cn/admin/" target="_blank" rel="noopener">打开商家后台 ↗</a><small>',
              '<a class="project-link" href="https://flow.seekblack.cn/admin/" target="_blank" rel="noopener">打开商家后台 ↗</a><a class="project-link" href="https://github.com/BlackCatKingdom/flow-mini-program-demo" target="_blank" rel="noopener">VIEW SOURCE ↗</a><small>'
            ),
            'work/motion/index.html': (
              '<a class="btn btn-brand" href="https://motion.seekblack.cn/" target="_blank" rel="noopener">VISIT LIVE DEMO ↗</a><small>',
              '<a class="btn btn-brand" href="https://motion.seekblack.cn/" target="_blank" rel="noopener">VISIT LIVE DEMO ↗</a><a class="project-link" href="https://github.com/BlackCatKingdom/motion-fitness-app-demo" target="_blank" rel="noopener">VIEW SOURCE ↗</a><small>'
            ),
          }
          for filename, (old, new) in replacements.items():
              p = Path(filename)
              s = p.read_text()
              if 'VIEW SOURCE ↗' in s:
                  continue
              if old not in s:
                  raise SystemExit(f'Expected CTA not found: {filename}')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/add-source-links.yml
          git add work/north/index.html work/flow/index.html work/motion/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add GitHub source links to case studies'
          git push origin main
